<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pasajero - MartillosiRuedas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 400px; background: #1e1e1e; padding: 20px; box-shadow: 4px 0 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; z-index: 1000; box-sizing: border-box; }
        #map { flex-grow: 1; height: 100%; }
        h1 { color: #00ff88; font-size: 20px; margin-top: 0; }
        .welcome { color: #aaa; font-size: 13px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 12px; font-weight: bold; }
        input, select { width: 100%; padding: 9px; margin-bottom: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background: #00ff88; color: #000; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; font-size: 14px; margin-top: 5px; }
        button:hover { background: #00cc6a; }
        .btn-logout { background: #ff4444; color: #fff; text-decoration: none; display: block; text-align: center; padding: 8px; border-radius: 5px; font-weight: bold; font-size: 13px; margin-top: 10px; }
        .btn-logout:hover { background: #cc0000; }
        .gps-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .gps-btn { background: #0275d8 !important; color: #fff !important; width: 95px !important; padding: 0 !important; font-size: 12px !important; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; margin-top: 0 !important; }
        .gps-btn:hover { background: #025aa5 !important; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h1>🏍️ Panel de Pasajero</h1>
            <div class="welcome">Bienvenido, <b>{{ nombre }}</b><br>Contacto: {{ contacto }}</div>

            <form id="form-solicitud">
                <label>📍 Tu Ubicación (Origen GPS):</label>
                <div class="gps-row">
                    <input type="text" id="origen" value="San Juan de los Morros" required style="margin-bottom:0;">
                    <button type="button" class="gps-btn" onclick="obtenerGPS()">🛰️ GPS</button>
                </div>

                <label>¿A dónde vamos en San Juan de los Morros?</label>
                <input type="text" id="destino" placeholder="Ej: Plaza Bolívar, Terminal..." required>

                <label>Selecciona el tipo de servicio:</label>
                <select id="tipo" required>
                    <option value="Carrera Corta">Carrera Corta ($1.50)</option>
                    <option value="Carrera Larga">Carrera Larga ($3.00)</option>
                    <option value="Encomienda / Paquete">Encomienda / Paquete ($2.50)</option>
                </select>

                <label>Precio Estimado (USD):</label>
                <select id="precio" required>
                    <option value="1.50">$1.50</option>
                    <option value="3.00">$3.00</option>
                    <option value="2.50">$2.50</option>
                </select>

                <button type="submit">Solicitar Moto</button>
            </form>
        </div>

        <div>
            <a href="/logout" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const bounds = [
            [9.85, -67.41], 
            [9.96, -67.31]  
        ];

        const map = L.map('map', {
            maxBounds: bounds,
            maxBoundsViscosity: 1.0,
            minZoom: 14,
            maxZoom: 18
        }).setView([9.9042, -67.3636], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = L.marker([9.9042, -67.3636]).addTo(map)
            .bindPopup('San Juan de los Morros').openPopup();

        function obtenerGPS() {
            const origenInput = document.getElementById('origen');
            if (!navigator.geolocation) {
                alert("GPS no soportado en tu navegador.");
                return;
            }
            origenInput.value = "Buscando satélites...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    origenInput.value = "Lat: " + lat.toFixed(6) + ", Lng: " + lng.toFixed(6);
                    
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng])
                        .bindPopup('Tu ubicación GPS actual').openPopup();
                },
                (err) => {
                    origenInput.value = "San Juan de los Morros (Manual)";
                    alert("No se pudo obtener la ubicación GPS exacta.");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        document.getElementById('form-solicitud').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                tipo: document.getElementById('tipo').value,
                precio: document.getElementById('precio').value,
                origen: document.getElementById('origen').value,
                destino: document.getElementById('destino').value
            };
            fetch('/api/solicitar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(resp => {
                if(resp.status === 'success') {
                    alert("¡Carrera solicitada con éxito! Choferes notificados.");
                    document.getElementById('destino').value = '';
                } else {
                    alert("Error: " + resp.mensaje);
                }
            });
        });
    </script>
</body>
</html>
