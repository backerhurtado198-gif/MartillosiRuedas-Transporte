<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - MartillosiRuedas</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 850px; padding: 20px; box-sizing: border-box; }
        
        /* Contenedor del Video de Presentación */
        .video-container { width: 100%; max-width: 320px; margin-bottom: 15px; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.7); background: #000; display: flex; justify-content: center; }
        .video-container video { width: 100%; height: auto; display: block; }

        .container { display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); width: 100%; max-width: 370px; border-top: 4px solid #f39c12; box-sizing: border-box; }
        h2 { margin-top: 0; color: #f39c12; font-size: 1.3rem; text-align: center; }
        p { color: #aaa; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #444; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        button { background: #f39c12; color: #121212; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e67e22; }
        .error { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; margin-bottom: 20px; width: 100%; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Video Corporativo de Presentación -->
        <div class="video-container">
            <video autoplay muted playsinline loop>
                <source src="{{ url_for('static', filename='logo.mp4') }}" type="video/mp4">
                Tu navegador no soporta la reproducción de videos.
            </video>
        </div>

        <p style="color: #888; margin-bottom: 20px; font-size: 0.9rem; text-align: center;">Sistema Hermético de Transporte - San Juan de los Morros</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <div class="container">
            <!-- Acceso Personal Operativo -->
            <div class="card">
                <h2>🔐 Personal Operativo</h2>
                <p>PIN de Chofer o Administrador</p>
                <form action="/procesar_pin" method="POST">
                    <input type="password" name="pin" placeholder="Ingresa tu PIN" required autocomplete="current-password">
                    <button type="submit">Entrar al Sistema</button>
                </form>
            </div>

            <!-- Acceso Pasajeros Autorizados -->
            <div class="card" style="border-top-color: #2ecc71;">
                <h2 style="color: #2ecc71;">👤 Pasajeros Autorizados</h2>
                <p>Gmail o teléfono registrado</p>
                <form action="/procesar_pasajero" method="POST">
                    <input type="text" name="contacto" placeholder="correo@gmail.com o 0414..." required autocomplete="username">
                    <button type="submit" style="background: #2ecc71; color: #121212;">Iniciar Sesión</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
