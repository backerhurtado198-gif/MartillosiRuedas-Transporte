<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Unidad - MartillosiRuedas</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 40px; border-radius: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); text-align: center; width: 100%; max-width: 400px; border-top: 4px solid #f39c12; }
        h1 { margin-bottom: 10px; color: #f39c12; font-size: 1.6rem; }
        p { color: #aaa; font-size: 0.9rem; margin-bottom: 25px; }
        select { width: 100%; padding: 12px; border-radius: 8px; background: #2a2a2a; color: white; border: 1px solid #444; font-size: 1rem; margin-bottom: 20px; outline: none; }
        button { background: #f39c12; color: #121212; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e67e22; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛵 Selección de Flota</h1>
        <p>Elige tu número de unidad asignada para iniciar turno</p>
        <form action="/guardar-unidad" method="POST">
            <select name="unidad" required>
                <option value="" disabled selected>Selecciona tu Unidad (1 - 50)</option>
                <script>
                    for(let i = 1; i <= 50; i++) {
                        document.write(`<option value="${i}">Unidad #${i}</option>`);
                    }
                </script>
            </select>
            <button type="submit">Comenzar Turno</button>
        </form>
    </div>
</body>
</html>
