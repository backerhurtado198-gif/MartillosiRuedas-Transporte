<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MartillosiRuedas - Iniciar Sesión</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #1a1d20; color: #f8f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #2b3036; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); width: 100%; max-width: 400px; border: 1px solid #3a4047; text-align: center; }
        .logo { font-size: 42px; margin-bottom: 5px; }
        h2 { color: #ffcc00; margin: 0 0 20px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; text-align: left; font-size: 13px; font-weight: bold; color: #ffcc00; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 18px; border: 1px solid #4a515a; border-radius: 10px; background: #1a1d20; color: #fff; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #ffcc00; outline: none; }
        button { width: 100%; padding: 14px; background: #ffcc00; color: #111; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        button:hover { background: #e6b800; }
        a { color: #ffcc00; text-decoration: none; font-size: 14px; display: inline-block; margin-top: 15px; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🛵</div>
        <h2>MartillosiRuedas</h2>
        <form method="POST">
            <label>Teléfono</label>
            <input type="text" name="telefono" placeholder="Ej: 04121234567" required>
            <label>Contraseña</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <button type="submit">Ingresar</button>
        </form>
        <a href="/registro">¿No tienes cuenta? Regístrate aquí</a>
    </div>
</body>
</html>
